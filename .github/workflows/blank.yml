name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        # 1. 프로젝트 최상위 폴더 찾기 및 이동
        BUILD_FILE=$(find . -name "build.gradle*" -not -path "*/app/*" | head -n 1)
        if [ -z "$BUILD_FILE" ]; then
          BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
        fi
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Project directory found at: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # 2. 손상/누락된 Gradle Wrapper(gradlew, wrapper.jar) 서버에서 자동 재생성
        echo "Generating fresh Gradle 8.5 wrapper..."
        gradle wrapper --gradle-version 8.5
        chmod +x ./gradlew

        # 3. APK 컴파일 실행
        ./gradlew assembleDebug -x test -x lint

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
